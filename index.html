<style>
/* Layout: arcade screen centered; on phones a floating analog stick (left) and round buttons (right) overlay the screen. Single dark look by choice. */
:root{
  --bg:#0b0a1a; --frame:#0b0920; --rim:#3b3570; --ink:#f4efe4; --muted:#9c96c4;
  --line1:#2b3f9c; --safety:#f5c92e; --pad:#1d1a3d;
  --font:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{position:fixed;inset:0;width:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#wrap{height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:8px}
body.touch.portrait #wrap{justify-content:center;padding-block:max(14px, env(safe-area-inset-top,0px)) 230px}
body.touch.landscape #wrap{padding:0}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;border:4px solid var(--frame);box-shadow:0 0 0 4px var(--rim),0 14px 40px rgba(0,0,0,.55);background:#000;max-width:100%;outline:none}
body.touch.landscape #game{border:0;box-shadow:none}
#game:focus-visible{box-shadow:0 0 0 4px var(--safety),0 14px 40px rgba(0,0,0,.55)}
#keys{font-size:15px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;max-width:960px;line-height:1.5}
#keys span{white-space:nowrap}
kbd{font-family:var(--font);background:var(--pad);border:2px solid var(--rim);border-bottom-width:4px;color:var(--ink);padding:0 6px;border-radius:3px;font-size:14px}
body.touch #keys{display:none}

#zone{display:none;position:fixed;left:0;bottom:0;width:52%;height:62%;touch-action:none;z-index:4}
body.touch #zone{display:block}
#stick{position:absolute;left:max(22px, env(safe-area-inset-left,0px));bottom:max(22px, env(safe-area-inset-bottom,0px));width:88px;height:88px;background:var(--img) no-repeat center/100% 100%;image-rendering:pixelated;pointer-events:none}
#stick.idle{opacity:.6}
#knob{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;background:var(--img) no-repeat center/100% 100%;image-rendering:pixelated}
#btns{display:none;position:fixed;right:max(16px, env(safe-area-inset-right,0px));bottom:max(14px, env(safe-area-inset-bottom,0px));width:150px;height:180px;z-index:5;pointer-events:none}
body.touch #btns{display:block}
body.touch.menu #btns,body.touch.menu #stick{display:none}
.rb{position:absolute;font-family:var(--font);color:transparent;font-size:0;border:0;border-radius:0;padding:0;background:var(--img) no-repeat center/100% 100%;image-rendering:pixelated;pointer-events:auto;touch-action:none;display:flex;align-items:flex-end;justify-content:center;line-height:1;
  text-shadow:2px 0 0 #140e1c,-2px 0 0 #140e1c,0 2px 0 #140e1c,0 -2px 0 #140e1c,2px 2px 0 #140e1c}
.rb.on{background-image:var(--img-on)}
.rb{opacity:.92}
.rb::after{content:attr(aria-label);position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:0;color:#f4efe4;font-size:11px;white-space:nowrap;text-shadow:2px 0 0 #140e1c,-2px 0 0 #140e1c,0 2px 0 #140e1c,0 -2px 0 #140e1c}
.rb.atk{width:72px;height:72px;right:4px;bottom:20px}
.rb.atk::after{font-size:12px}
.rb.dodge{width:54px;height:54px;right:82px;bottom:13px}
.rb.ult{width:54px;height:54px;right:76px;bottom:86px}
.rb.guide{width:54px;height:54px;right:10px;bottom:114px}
.rb.ult.ready{background-image:var(--img-ready);animation:blink .5s steps(2) infinite}
.rb.ult.ready.on{background-image:var(--img-on)}
.rb.ult.ready2{background-image:var(--img-ready2);animation:blink .3s steps(2) infinite}
.rb.ult.ready2.on{background-image:var(--img-on)}
.rb.guide.ready{background-image:var(--img-ready);animation:blink .55s steps(2) infinite}
.rb.guide.ready.on{background-image:var(--img-on)}
@keyframes blink{50%{filter:brightness(1.35) drop-shadow(0 0 0 #fff3a0)}}
body.danger #game{animation:danger .45s steps(2) infinite}
@keyframes danger{50%{box-shadow:0 0 0 4px #ff3a3a,0 0 0 8px rgba(255,40,40,.6)}}
@media (prefers-reduced-motion: reduce){.rb.ult.ready,.rb.guide.ready,body.danger #game{animation:none}}
</style>

<body>
<div id="wrap">
  <canvas id="game" width="960" height="540" tabindex="0" aria-label="지하철 공익 어드벤처 게임 화면"></canvas>
  <div id="keys" aria-label="조작법">
    <span><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> 이동</span>
    <span><kbd>Z</kbd> 공격 (연타 3단 콤보)</span>
    <span><kbd>X</kbd> 회피</span>
    <span><kbd>C</kbd> 궁극기 (게이지 100: 1단 · 200: 2단)</span>
    <span><kbd>V</kbd> 안내 (도움이 필요한 승객)</span>
    <span><kbd>Enter</kbd> 확인</span>
    <span><kbd>Esc</kbd>/<kbd>P</kbd> 일시정지·메뉴 · <kbd>M</kbd> 소리</span>
  </div>
</div>
<div id="zone" aria-label="이동 조이스틱 영역"><div id="stick" class="idle"><div id="knob"></div></div></div>
<div id="btns">
  <button class="rb guide" data-k="guide" aria-label="안내">안내</button>
  <button class="rb ult" data-k="ult" aria-label="궁극기">궁극기</button>
  <button class="rb dodge" data-k="dodge" aria-label="회피">회피</button>
  <button class="rb atk" data-k="atk" aria-label="공격">공격</button>
</div>

function fit() {
  const vv = window.visualViewport, vw = vv ? vv.width : window.innerWidth, vh = vv ? vv.height : window.innerHeight;
  const land = vw > vh;
  document.body.classList.toggle('landscape', land);
  document.body.classList.toggle('portrait', !land);
  let aw, ah;
  if (isTouch) {
    if (land) { aw = vw; ah = vh; }
    else { aw = vw - 32; ah = vh - 250; }
  } else {
    aw = document.getElementById('wrap').clientWidth - 40;
    ah = window.innerHeight - document.getElementById('keys').offsetHeight - 54;
  }
  let s = Math.min(aw / W, ah / H);
  if (!isTouch && s >= 2) s = Math.floor(s);
  s = Math.max(0.6, s);
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  cvs.style.width = Math.round(W * s) + 'px';
  cvs.style.height = Math.round(H * s) + 'px';

      const wh = mkCanvas(w, h, c => { c.drawImage(im, 0, 0); c.globalCompositeOperation = 'source-in'; c.fillStyle = '#fff'; c.fillRect(0, 0, w, h); });
      const whf = mkCanvas(w, h, c => { c.drawImage(f, 0, 0); c.globalCompositeOperation = 'source-in'; c.fillStyle = '#fff'; c.fillRect(0, 0, w, h); });

function moveInput() {

function stageScore(G) {
  const secs = G.time / 60;
  return Math.round(clamp(100 - G.dmg * 0.3 + G.maxCombo * 0.8 + G.kos * 0.4 + G.guided * 4 - G.deaths * 12 - Math.max(0, secs - 320) * 0.05, 0, 100));
}

function addTotals() {

  T.kos += G.kos; T.guided += G.guided; T.dmg += G.dmg; T.deaths += G.deaths; T.maxCombo = Math.max(T.maxCombo, G.maxCombo); T.time += G.time; T.ults += G.ults; T.vend += G.vend && G.vend.broken ? 1 : 0;
  T.scores.push(stageScore(G));
  G.kos = 0; G.guided = 0; G.ults = 0; if (G.vend) G.vend.broken = false;
}
function stageClear() {
  const G = game;
  G.result = { score: stageScore(G), secs: G.time / 60, kos: G.kos, guided: G.guided, maxCombo: G.maxCombo, deaths: G.deaths };
  G.result.grade = gradeOf(G.result.score);
  addTotals();

}

function step() {
  tick++;
